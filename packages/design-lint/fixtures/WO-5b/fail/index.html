<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>A page title</title>
</head>
<body>
<main>
<h1>Title</h1>
<style>.s { width: 20px; height: 20px; border: 2px solid; animation: spin 1s linear infinite; } @keyframes spin { to { transform: rotate(360deg); } }</style>
<div class="s"></div>
<p id="t">0</p>
<script>var n = 0; setInterval(function () { document.getElementById("t").textContent = ++n; }, 500);</script>
</main>
</body>
</html>
