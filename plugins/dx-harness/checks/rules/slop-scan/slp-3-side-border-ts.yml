# The ts counterpart of slp-3-side-border-tsx.yml. A `.ts` file has no JSX, so
# the class string is the element scope.
id: slop-scan-slp-3-side-border-ts
language: ts
severity: warning
message: candidate slp 3 side-tab border
metadata:
  control: SLP-3
  check: slop-scan
  surface: text
  context: side-border
rule:
  matches: ts-code-node
  regex: '(?i)(\bborder-(l|r|t|b|s|e|x|y)-|border(Left|Right|Top|Bottom|Inline|Block)|border-(left|right|top|bottom|inline-start|inline-end))'
