# The ts counterpart of slp-2-clip-tsx.yml. A `.ts` file has no JSX, so the
# element scope degenerates to the class string itself: a `cva` base string or
# a class-list constant is the whole element's class list.
id: slop-scan-slp-2-clip-ts
language: ts
severity: warning
message: candidate slp 2 gradient text
metadata:
  control: SLP-2
  check: slop-scan
  surface: text
  context: clip
rule:
  matches: ts-code-node
  regex: '(?i)(bg-clip-|background-clip|backgroundClip)'
