# The ts counterpart of slp-1-gradient-tsx.yml. `.ts` never aliases to tsx
# (see sgconfig.yml), so it carries its own rule.
id: slop-scan-slp-1-gradient-ts
language: ts
severity: warning
message: candidate slp 1 gradient palette
metadata:
  control: SLP-1
  check: slop-scan
  surface: text
  context: gradient
rule:
  matches: ts-code-node
  regex: '(?i)((repeating-)?(linear|radial|conic)-gradient\s*\(|\bbg-(gradient-to-|linear-|radial|conic))'
