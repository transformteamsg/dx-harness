# A style="…" attribute value: a CSS declaration list with no braces around it.
# checklib.astgrep_scan() re-scans it with the css rules, which is how a
# multi-line style attribute is reached — the old regex tracker documented that
# it handled the single-line case only.
#
# A <style> block needs no rule of its own: measured at 0.44.1, ast-grep parses
# the block as CSS inside the html file itself and reports host line numbers, so
# the css rules already reach it.
id: shared-style-region-html
language: html
severity: warning
message: style region
metadata:
  check: shared
  surface: style-region
  kind: attribute_value
  context: style-attribute
rule:
  kind: attribute_value
  inside:
    kind: attribute
    stopBy: end
    regex: '^style\s*='
