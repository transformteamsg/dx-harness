# A JSX element carrying role="table" whose whole subtree holds no
# role="columnheader". The ARIA twin of the <table>/<th> rule: the same defect,
# expressed through roles rather than elements.
#
# Only the literal string form matches. A computed `role={x}` is not resolvable
# from source, so it is left alone rather than guessed at.
#
# role="grid" and role="treegrid" are deliberately absent. Both carry
# interaction contracts a source scan cannot judge, and widening to them would
# take this rule past the sure case it is scoped to.
id: structure-role-table-headers-tsx
language: tsx
severity: warning
message: candidate role="table" with no column header
metadata:
  control: A11Y-7
  check: structure
  surface: structure
  rule: TABLE-HEADERS
  pattern: role-table
  kind: jsx_element
rule:
  kind: jsx_element
  all:
    - has:
        kind: jsx_opening_element
        has:
          kind: jsx_attribute
          regex: '^role="table"$'
    - not:
        has:
          stopBy: end
          kind: jsx_attribute
          regex: '^role="columnheader"$'
