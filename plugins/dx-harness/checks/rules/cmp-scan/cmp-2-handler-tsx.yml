# CMP-2, handler position 1: a declaration whose NAME field is handler-shaped
# (`on*` or `handle*`). The rule proves the position; which verb stems count as
# destructive stays in Python, because a stem list is policy and a rule never
# carries one.
#
# A variable declarator has to hold a function-shaped value (an arrow, a function
# expression, or a call such as useCallback(…)), or `const handleDeleteLabel =
# "Delete"` would be offered as an action.
id: cmp-scan-cmp-2-handler-tsx
language: tsx
severity: warning
message: candidate cmp 2 handler
metadata:
  control: CMP-2
  check: cmp-scan
  surface: cmp2-handler
  context: handler
rule:
  any:
    - kind: function_declaration
      has:
        field: name
        regex: '^(?:on|handle)[A-Z_]'
    - kind: generator_function_declaration
      has:
        field: name
        regex: '^(?:on|handle)[A-Z_]'
    - kind: method_definition
      has:
        field: name
        regex: '^(?:on|handle)[A-Z_]'
    - all:
        - kind: variable_declarator
        - has:
            field: name
            regex: '^(?:on|handle)[A-Z_]'
        - has:
            field: value
            any:
              - kind: arrow_function
              - kind: function_expression
              - kind: call_expression
