# DX Design Standard — control catalog (single source of truth)
# Normative source: DX Design Standard (DX-DS) v0.1 seed catalog.
# Consumers: the design harness (agent enforcement — this repo's skills/checks)
# and the DX-DS website (human presentation — renders and serves this file raw).
# Format: standards/README.md. Detail files: standards/controls/<id>.md
# Scope: optional per-control products:/audiences: fields — absent = global (all). See standards/README.md §Scope.
# WCAG 2.2 AA is the self-imposed accessibility floor (kept because it's right,
# not because it's mandated). SGDS / GOV.UK are reference points, not rules.
# Consolidated 2026-06-11 from the harness catalog (28 controls, operational
# schema) and the site seed catalog (32 controls, incl. the anti-slop controls): union of
# both, harness schema, site fails_when bullets carried per entry.

meta:
  version: "0.1"
  updated: "2026-07-12"
  waiver_syntax: 'dx-waive <ID> reason="<specific reason>"'
  categories:
    A11Y: Accessibility
    TOK: Tokens & theming
    TYP: Typography
    COL: Colour
    CMP: Components & patterns
    CNT: Content & naming
    MOT: Motion
    IDN: Identity
    SLP: Anti-slop
    LAY: Layout
  products:
    tw: Teacher Workspace   # TW-adjacent surfaces (Posts, PG Staff Portal) count as tw
    casesync: CaseSync
    glow: Glow
    # A repo outside the portfolio (incl. this standard's own site) answers
    # `other` and names the actual product in the decision record; every
    # products:-scoped control is then recorded as deliberately out of scope.
    # Never used in a control's products: list — controls scope to real products.
    other: Outside the portfolio — name the product in the decision record
  audiences:
    teachers: Teachers & school staff
    students-primary: Students — primary
    students-secondary: Students — secondary and up
    parents: Parents & guardians

controls:
  # ── Tokens & theming (Base UI + Radix Colors + shadcn defaults) ───────
  - id: TOK-1
    source: DX-DS
    title: UI code contains no raw colour values — semantic (shadcn) tokens only
    tier: L1
    check: deterministic
    phase: [implement, verify]
    applies_to: [page, component]
    verify: "Scan changed files for raw hex/rgb/hsl; checks/token-audit; exit 1 on violation"
    waiver: documented
    fails_when:
      - hex/rgb/hsl literals in component code
    detail: controls/tok-1.md
    enforced: script
    script: checks/token-audit.py
    refs: [https://moediva.notion.site/Tfx-design-standard-draft-37b970a387f2800e930ce0ee646c6cfb]

  - id: TOK-2
    source: DX-DS
    title: All spacing values come from the shadcn default token scale
    tier: L1
    check: deterministic
    phase: [implement, verify]
    applies_to: [page, component]
    verify: "No off-scale margin/padding/gap values; checks/token-audit"
    waiver: documented
    fails_when:
      - arbitrary pixel values for margin/padding/gap
    enforced: script
    script: checks/token-audit.py
    refs: [https://moediva.notion.site/Tfx-design-standard-draft-37b970a387f2800e930ce0ee646c6cfb]

  - id: TOK-3
    source: DX-DS
    title: Corner radii come from the shadcn default radius scale
    tier: L1
    check: deterministic
    phase: [implement, verify]
    applies_to: [component]
    verify: "No off-scale border-radius values; checks/token-audit"
    waiver: documented
    fails_when:
      - ad-hoc radius values
      - child radius larger than parent (non-concentric nesting)
      - peer containers of the same kind use different corner radii — anchor to the product's Card/base radius
    detail: controls/tok-3.md
    enforced: partial
    script: checks/token-audit.py
    refs: [https://moediva.notion.site/Tfx-design-standard-draft-37b970a387f2800e930ce0ee646c6cfb]

  # ── Typography ────────────────────────────────────────────────────────
  # TYP-1 brand-wordmark exception added 2026-07-01 — ratchet, design-lead approved
  # (Glow pilot: the Inria Sans wordmark is a deliberate brand lockup typeface with no
  # registered exception, so it read as a hard third-typeface L1 violation. Add a
  # per-product registered-wordmark registry, mirroring COL-1's per-product colour
  # table.) See docs/catalog-changes/glow-pilot-col1-typ1-tok3.md
  - id: TYP-1
    source: DX-DS
    title: Display text is Plus Jakarta Sans (600); body/UI text is Inter (400/500/600); no other typefaces
    tier: L1
    check: deterministic
    phase: [implement, verify]
    applies_to: [page, component]
    verify: "Font-family scan; only Plus Jakarta Sans + Inter at approved weights, plus each product's registered brand-wordmark typeface used solely for its wordmark/logo lockup (see controls/typ-1.md); checks/type-scan"
    waiver: documented
    fails_when:
      - any third typeface in product UI, except a product's registered brand-wordmark typeface confined to its wordmark/logo lockup (see controls/typ-1.md)
    detail: controls/typ-1.md
    enforced: partial
    script: checks/type-scan.py
    refs: [https://moediva.notion.site/Tfx-design-standard-draft-37b970a387f2800e930ce0ee646c6cfb]

  # TYP-3: ratchet revision 2026-07-15 — migrated the published scale from the
  # custom DX pixel set to Tailwind's default type scale, adopted from the harness
  # philosophy "the stack is fixed and boring on purpose: Base UI components, Radix
  # Colors, shadcn/ui default tokens." Approved by: Reza Ilmi (design lead),
  # 2026-07-15 — in-session decision (chose "Migrate to Tailwind defaults" over
  # keeping the DX scale); recommended options adopted.
  - id: TYP-3
    source: DX-DS
    title: Type sizes come from the Tailwind default type scale; no off-scale sizes
    tier: L1
    check: deterministic
    phase: [implement, verify]
    applies_to: [page, component]
    verify: "Sizes in {128,96,72,60,48,36,30,24,20,18,16,14,12}; checks/type-scan"
    waiver: documented
    fails_when:
      - font sizes not on the published scale
    enforced: script
    script: checks/type-scan.py
    refs: [https://moediva.notion.site/Tfx-design-standard-draft-37b970a387f2800e930ce0ee646c6cfb]

  # ── Colour ────────────────────────────────────────────────────────────
  # COL-1 re-tagged deterministic → hybrid 2026-07-01 — ratchet, design-lead
  # approved (Glow pilot audit HF: the mechanical half — colour resolves to a
  # token — passes trivially; the real failure is a neutral variant sitting
  # where the brand primary belongs, which is judgment. Glow primary confirmed
  # #F76B15; foreground-pairing + same-hue-collision guidance added).
  # See docs/catalog-changes/glow-pilot-col1-typ1-tok3.md
  - id: COL-1
    source: DX-DS
    title: Primary actions and brand moments use the product's own primary brand colour (or its ramp)
    tier: L1
    check: hybrid
    phase: [implement, verify]
    applies_to: [page, component]
    verify: "Deterministic half: primary-action and brand-moment colours resolve to the active product's primary token or its ramp (checks/token-audit). Judgment half: the evaluator confirms the view's single primary action is the product primary (dovetails CMP-5a) and no other product's primary appears for emphasis; see controls/col-1.md for the per-product table and the foreground pairing"
    waiver: documented
    fails_when:
      - primary CTA in a colour that is not the product's primary
      - one product's primary used inside another product's surface
      - a light-hue product primary (orange/amber/lime/yellow) paired with white label text that fails WP-13a (use the scale's dark contrast step)
    detail: controls/col-1.md
    enforced: partial
    script: checks/token-audit.py
    refs: [https://moediva.notion.site/Tfx-design-standard-draft-37b970a387f2800e930ce0ee646c6cfb]

  # COL-2 broadened 2026-06-25 — ratchet, design-lead approved (small functional
  # text uses step-12 on a tint; HF-9). See docs/catalog-changes/contrast-functional-chips-step-12.md
  - id: COL-2
    source: DX-DS
    title: Functional colours (success/warning/danger) come from the shared Radix Colors scales, never ad-hoc; small functional-colour text (≤12px chips/labels) uses the scale's step-12 on a tinted background so it clears AA (WP-13a)
    tier: L1
    check: deterministic
    phase: [implement, verify]
    applies_to: [page, component]
    verify: "Success/warning/danger/info colours resolve to Radix scale tokens, and small functional-colour text on a tint resolves to step-12 (step-11 on a step-3 tint lands ~4.25:1 and fails AA); contrast computed by checks/contrast / verified manually until wired"
    waiver: documented
    fails_when:
      - custom green/red/amber values
      - red used decoratively
      - small functional-colour text (≤12px) on a tint uses step-11 (or lower) and falls below 4.5:1
    detail: controls/col-2.md
    enforced: partial
    script: checks/token-audit.py
    refs: [https://moediva.notion.site/Tfx-design-standard-draft-37b970a387f2800e930ce0ee646c6cfb]

  # ── Components & patterns ─────────────────────────────────────────────
  - id: CMP-1
    source: DX-DS
    title: Where a Base UI-based component exists for the need, it is used; one-offs require a waiver
    tier: L1
    check: hybrid
    phase: [plan, implement, verify]
    applies_to: [page, component]
    verify: "Component usage diffed against the product manifest; evaluator judges 'exists for the need' edge cases; record carries one of the three fixed CMP-1 verdict forms (see controls/cmp-1.md)"
    waiver: documented
    fails_when:
      - custom dropdown/dialog/tooltip where the stack provides one
    detail: controls/cmp-1.md
    enforced: partial
    script: checks/component-manifest.py
    refs: [https://moediva.notion.site/Tfx-design-standard-draft-37b970a387f2800e930ce0ee646c6cfb]

  # ── Content & naming ──────────────────────────────────────────────────
  # CNT-14: ratchet 2026-07-10, design-lead approved 2026-07-22 — holistic voice
  # quality + tone-fit, the one slice of the voice & tone guideline
  # (procedures/copy-rules.md) no existing control owns. Judgment-only:
  # no static signal decides "sounds
  # thoughtful" or "tone fits this surface". Disjoint from the mechanical voice
  # rules (CNT-3a person/voice, CNT-6a filler, CNT-8a nominalisations, CNT-12a
  # case, CNT-15a AI tells) — those catch specific tokens/patterns; CNT-14 grades the
  # gestalt a string can fail while passing every mechanical rule. Boundary with
  # CMP-2a: CMP-2a governs destructive-action behaviour (consequences + undo/confirm);
  # CNT-14 governs whether the wording is sober vs dramatic. Re-audit set =
  # every shipped surface carrying user-facing copy.
  - id: CNT-14
    source: DX-DS
    title: Copy embodies the DX voice (Clear, Thoughtful, Approachable) and its tone fits the surface context
    tier: L2
    check: judgment
    phase: [implement, verify]
    applies_to: [content]
    verify: "Evaluator reads the copy against the voice attributes and the tone-by-context table in voice-tone.mdx: does it sound Clear/Thoughtful/Approachable (not cold, robotic, patronising, alarmist, or sappy), and does the tone match the surface (affirming success, calm error, sober destructive, inviting empty state)?"
    waiver: rationale
    fails_when:
      - an error message that is alarmist or dramatic rather than calm and helpful
      - a success message that gushes instead of acknowledging briefly
      - an empty state or onboarding step that is patronising or careless
      - a destructive confirmation written with drama instead of sober, plain consequences
    detail: controls/cnt-14.md
    refs: [https://moediva.notion.site/Tfx-design-standard-draft-37b970a387f2800e930ce0ee646c6cfb]

  # ── Identity ──────────────────────────────────────────────────────────
  - id: IDN-1
    source: DX-DS
    title: Product lockups and logos render only from approved assets; no recreations
    tier: L1
    check: hybrid
    phase: [implement, verify]
    applies_to: [page]
    verify: "Logo/lockup files resolve to the approved asset library; no inline redraws"
    waiver: documented
    fails_when:
      - rebuilt or distorted logo marks
    detail: controls/idn-1.md
    refs: [https://moediva.notion.site/Tfx-design-standard-draft-37b970a387f2800e930ce0ee646c6cfb]

  # IDN-2..4: branding controls activated via the ratchet 2026-07-06 (plan 057),
  # from recorded facts (COL-1 table, content skill §6, product-icons guideline).
  # Design-lead approved: Reza Ilmi, 2026-07-06 (in-session). Records:
  # docs/catalog-changes/idn-{2,3,4}-*.md. IDN-4 is the first product-scoped control.
  - id: IDN-2
    source: DX-DS
    title: Product icons render only from the approved product-icon family; no ad-hoc, redrawn, or regenerated icons
    tier: L1
    check: hybrid
    phase: [implement, verify]
    applies_to: [page, component]
    verify: "Icon files resolve to the approved product-icon set (the guideline's icon family); no inline-drawn or regenerated marks; new marks are pre-verified via the Icon Generator before entering the set"
    waiver: documented
    fails_when:
      - a redrawn, distorted, or regenerated product-icon mark
      - a per-product background colour or gradient applied to the icon container
      - wordmarks, photos, shadows, or gloss inside the icon
    detail: controls/idn-2.md
    refs: [https://moediva.notion.site/Tfx-design-standard-draft-37b970a387f2800e930ce0ee646c6cfb]

  - id: IDN-3
    source: DX-DS
    title: Copy on a product's surface carries that product's calibrated tone register — same voice character, calibrated weight, never a switched voice system
    tier: L2
    check: judgment
    phase: [implement, verify]
    applies_to: [content]
    verify: "Evaluator reads the surface's copy against the product's row in the per-product register table (controls/idn-3.md): does it hold the shared voice character at the product's calibrated weight, or switch systems?"
    waiver: rationale
    fails_when:
      - copy adopts another product's register (a switched voice system, not calibrated weight)
      - a TW-adjacent surface (Posts / PG Staff Portal) carries nuance instead of plain TW voice
    detail: controls/idn-3.md
    refs: [https://moediva.notion.site/Tfx-design-standard-draft-37b970a387f2800e930ce0ee646c6cfb]

  - id: IDN-4
    source: DX-DS
    title: "CaseSync surfaces treat casework as sensitive: restrained celebration, no gamified or playful elements around case data"
    tier: L1
    check: judgment
    phase: [implement, verify]
    applies_to: [content, page, component]
    products: [casesync]
    verify: "On CaseSync surfaces, the evaluator confirms case-data moments are treated with restraint — no confetti/celebration animations, streak/badge/points gamification, or exclamatory congratulatory copy around case outcomes; acknowledgement is calm and privacy-forward"
    waiver: documented
    fails_when:
      - celebratory or confetti-style motion on a case-closure or case-outcome moment
      - streak / badge / points / leaderboard gamification attached to casework
      - exclamatory congratulatory copy on a sensitive case outcome
    detail: controls/idn-4.md
    refs: [https://moediva.notion.site/Tfx-design-standard-draft-37b970a387f2800e930ce0ee646c6cfb]
