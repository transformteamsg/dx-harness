name: CI

# Runs the plugin's checks (typecheck, unit tests, check self-tests, standards
# gate) on pushes to main and on pull requests targeting main.

# paths-ignore skips the whole job when every changed file is on the list, and
# no check reads any file on it. That is safe only while main has
# no required status check: today branch protection requires a review, not a
# check. A skipped run reports nothing, so a required check would wait forever.
# The gate job below reports for the jobs inside a run, but it cannot report
# for a run that paths-ignore skipped. If a required check is ever added, point
# it at the gate job and remove paths-ignore.
on:
  push:
    branches: [main]
    paths-ignore:
      - docs/ROADMAP.md
      - docs/specs/**
      - docs/superpowers/**
      - review/**
      - CLAUDE.md
  pull_request:
    branches: [main]
    paths-ignore:
      - docs/ROADMAP.md
      - docs/specs/**
      - docs/superpowers/**
      - review/**
      - CLAUDE.md

permissions:
  contents: read

jobs:
  # Decides whether the design-lint job runs. Most pull requests change skills
  # or documents and no file the design-lint tests read.
  changes:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    permissions:
      contents: read
      # paths-filter reads a pull request's changed files through the API.
      pull-requests: read
    outputs:
      design-lint: ${{ steps.filter.outputs.design-lint }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # The lockfile, the workspace, and this workflow change what the
          # design-lint tests run against, so a change to one runs them too.
          filters: |
            design-lint:
              - packages/design-lint/**
              - plugins/dx-harness/standards/rules/**
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
              - .github/workflows/ci.yml

  checks:
    # Pinned to the arm64 image rather than ubuntu-latest, which is x64. ARM images
    # are only published version-pinned, so there is no -latest to track: moving to a
    # newer image is a deliberate edit here. Free for public repositories.
    runs-on: ubuntu-24.04-arm
    # The ceiling replaces GitHub's 6-hour default, so a hang fails the run
    # instead of holding a runner for the afternoon.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install PyYAML and Pillow
        run: pip install pyyaml Pillow

      # pnpm test without the design-lint tests, which run in their own job.
      - name: Test
        run: pnpm run test:root

      - name: Check self-tests
        run: pnpm run test:checks

      - name: Standards gate
        run: pnpm check

  # Runs the design-lint tests when a file they read changes, and on every push
  # to main.
  design-lint:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.design-lint == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Each playwright-core version pins one Chromium build, so the version
      # keys the browser cache.
      - name: Read the playwright-core version
        id: playwright
        working-directory: packages/design-lint
        run: echo "version=$(node -p "require('playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}

      # The design-lint rendered tests drive a browser. The runner has no Chrome.
      # The browser comes from the cache when the version is unchanged; the
      # system packages are not in the cache, so their step always runs.
      - name: Install Chromium
        run: pnpm --filter design-lint exec playwright-core install chromium

      - name: Install Chromium system packages
        run: pnpm --filter design-lint exec playwright-core install-deps chromium

      - name: Test
        run: pnpm run test:design-lint

  # A skipped job reports nothing, so a required check on it would wait
  # forever. The gate always runs and reports one result for the whole run: it
  # passes when every job passed or was skipped.
  gate:
    needs: [changes, checks, design-lint]
    if: always()
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - name: Report the result of every job
        env:
          RESULTS: ${{ needs.changes.result }} ${{ needs.checks.result }} ${{ needs.design-lint.result }}
        run: |
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) echo "A job reported $result."; exit 1 ;;
            esac
          done
